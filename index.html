<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mạt Chược VN</title>

</head>

<body>
<h1>MẠT CHƯỢC VN</h1>

<div id="money">Tiền: 100.000</div>

<div class="controls">
  <button onclick="changeBet(-2000)">-</button>
  <span id="bet">Cược: 2.000</span>
  <button onclick="changeBet(2000)">+</button>
</div>

<div id="board"></div>

<button id="spinBtn" onclick="spin()">QUAY</button>

<script src="game.js"></script>
</body>
