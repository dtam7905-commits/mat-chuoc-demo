<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Mạt Chược VN</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:#0f5b3b;
  font-family:Arial;
  color:#fff;
  text-align:center;
}
h1{margin:10px 0}

.top{
  display:flex;
  justify-content:space-around;
  font-size:18px;
}

#board{
  width:320px;
  margin:15px auto;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
  background:#000;
  padding:10px;
  border-radius:12px;
}

.cell{
  background:#fff;
  border-radius:8px;
  height:55px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  box-shadow:0 0 0 rgba(255,215,0,0);
}

.cell.win{
  animation: glow 0.6s infinite alternate;
}

@keyframes glow{
  from{box-shadow:0 0 5px gold}
  to{box-shadow:0 0 15px gold}
}

.cell img{
  width:90%;
}

button{
  padding:12px 40px;
  font-size:20px;
  border:none;
  border-radius:12px;
  background:linear-gradient(#ffd45a,#f5a700);
  cursor:pointer;
}

#msg{
  margin-top:10px;
  font-size:20px;
  color:#ffd45a;
}

#admin{
  display:none;
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.8);
}
#adminBox{
  background:#222;
  width:260px;
  margin:120px auto;
  padding:20px;
  border-radius:10px;
}
input{
  width:100%;
  padding:8px;
  margin:6px 0;
}
</style>
</head>

<body>

<h1>🀄 MẠT CHƯỢC VN</h1>
<div class="top">
  <div>💰 Tiền: <span id="money">500000</span></div>
  <div>🎯 Cược: <span id="bet">10000</span></div>
</div>

<div id="board"></div>

<button onclick="spin()">QUAY</button>
<div id="msg">Chưa quay</div>

<!-- ADMIN -->
<div id="admin">
  <div id="adminBox">
    <h3>ADMIN</h3>
    <input id="pin" placeholder="PIN">
    <button onclick="login()">OK</button>
    <hr>
    <button onclick="addMoney()">+100K</button>
    <button onclick="subMoney()">-100K</button>
    <br><br>
    <button onclick="closeAdmin()">Đóng</button>
  </div>
</div>

<script>
/* ====== CONFIG ====== */
const ROWS=5, COLS=5;
const symbols=[
 {k:'man',p:3},
 {k:'pin',p:3},
 {k:'sou',p:3},
 {k:'trung',p:4},
 {k:'phat',p:4},
 {k:'bach',p:4},
 {k:'wild',p:10,wild:true},
 {k:'scatter',p:0,scatter:true}
];

let money=500000;
let bet=10000;
let grid=[];
let spinning=false;

/* ====== INIT ====== */
const board=document.getElementById('board');

function init(){
  board.innerHTML='';
  grid=[];
  for(let r=0;r<ROWS;r++){
    grid[r]=[];
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div');
      d.className='cell';
      d.innerHTML='<img src="images/man.png">';
      board.appendChild(d);
      grid[r][c]='man';
    }
  }
}
init();

/* ====== SPIN ====== */
function spin(){
  if(spinning) return;
  if(money<bet){alert('Hết tiền');return;}
  money-=bet;
  updateMoney();
  spinning=true;
  document.getElementById('msg').innerText='Đang quay...';

  let col=0;
  const drop=setInterval(()=>{
    for(let r=0;r<ROWS;r++){
      const sym=randomSymbol();
      grid[r][col]=sym.k;
      cell(r,col).innerHTML=`<img src="images/${sym.k}.png">`;
      cell(r,col).classList.remove('win');
    }
    col++;
    if(col>=COLS){
      clearInterval(drop);
      setTimeout(checkWin,300);
    }
  },200);
}

function randomSymbol(){
  return symbols[Math.floor(Math.random()*symbols.length)];
}

function cell(r,c){
  return board.children[r*COLS+c];
}

/* ====== WIN ====== */
function checkWin(){
  let win=0;

  // hàng ngang
  for(let r=0;r<ROWS;r++){
    let base=grid[r][0];
    let ok=true;
    for(let c=1;c<COLS;c++){
      if(grid[r][c]!==base && grid[r][c]!=='wild') ok=false;
    }
    if(ok){
      win+=bet*3;
      for(let c=0;c<COLS;c++) cell(r,c).classList.add('win');
    }
  }

  // scatter
  let sc=0;
  grid.flat().forEach(s=>{if(s==='scatter')sc++;});
  if(sc>=3){
    win+=bet*5;
    document.getElementById('msg').innerText='🎉 SCATTER!';
  }

  money+=win;
  updateMoney();

  document.getElementById('msg').innerText=
    win>0 ? `🎉 THẮNG ${win.toLocaleString()}` : 'Không trúng';

  spinning=false;
}

/* ====== UI ====== */
function updateMoney(){
  document.getElementById('money').innerText=money.toLocaleString();
}

/* ====== ADMIN ====== */
document.addEventListener('keydown',e=>{
  if(e.key==='a') document.getElementById('admin').style.display='block';
});

function login(){
  if(document.getElementById('pin').value==='9999'){
    alert('ADMIN OK');
  }else alert('SAI PIN');
}
function addMoney(){money+=100000;updateMoney();}
function subMoney(){money-=100000;updateMoney();}
function closeAdmin(){document.getElementById('admin').style.display='none';}
</script>

</body>
</html>
