<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Mạt Chược Slot VN</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{
  margin:0;background:#0f5c3a;color:#fff;
  font-family:Arial;text-align:center
}
h1{margin:10px}
#top{display:flex;justify-content:space-around;font-size:18px}
#board{
  width:340px;margin:10px auto;
  background:#000;padding:10px;border-radius:15px
}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{
  background:#fff;border-radius:8px;
  height:55px;display:flex;
  align-items:center;justify-content:center;
}
.cell img{width:40px}
.win{box-shadow:0 0 12px 5px gold;animation:shake .3s}
@keyframes shake{
  0%{transform:translate(0)}
  25%{transform:translate(2px)}
  50%{transform:translate(-2px)}
  75%{transform:translate(2px)}
}
button{
  padding:10px 22px;font-size:16px;
  border:none;border-radius:10px;background:gold
}
#msg{margin-top:10px;font-size:18px}
#admin{
  position:fixed;inset:0;
  background:rgba(0,0,0,.85);
  display:none;color:#fff
}
</style>
</head>

<body>
<h1>🀄 MẠT CHƯỢC VN</h1>

<div id="top">
  <div>💰 <span id="money"></span></div>
  <div>🎯 <span id="bet"></span></div>
</div>

<div id="board">
  <div class="grid" id="grid"></div>
</div>

<button onclick="betDown()">-</button>
<button onclick="spin()">QUAY</button>
<button onclick="betUp()">+</button>

<div id="msg"></div>

<!-- ADMIN -->
<div id="admin">
  <h2>ADMIN</h2>
  <input id="pin" placeholder="PIN">
  <button onclick="login()">OK</button><br><br>
  <button onclick="money+=100000;save()">+TIỀN</button>
  <button onclick="money-=100000;save()">-TIỀN</button>
  <button onclick="admin.style.display='none'">ĐÓNG</button>
</div>

<script>
/* ===== BASE64 ẢNH (DEMO) ===== */
const img=(c)=>`data:image/svg+xml;base64,${btoa(
`<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60'>
<rect width='100%' height='100%' rx='10' fill='${c}'/>
</svg>`)}`
const IMAGES={
 man:img('#d32'), pin:img('#39f'), sou:img('#3c3'),
 trung:img('#f33'), phat:img('#0c6'), bach:img('#fff'),
 wild:img('#fc0'), scatter:img('#f0f')
}

/* ===== DATA ===== */
let money=+localStorage.money||500000
let bet=+localStorage.bet||2000
const rows=5,cols=5
const grid=document.getElementById("grid")

const symbols=[
 {k:'man',w:2},{k:'pin',w:2},{k:'sou',w:2},
 {k:'trung',w:3},{k:'phat',w:3},{k:'bach',w:3},
 {k:'wild',w:5},{k:'scatter',s:true}
]

/* ===== INIT ===== */
for(let i=0;i<25;i++){
 const d=document.createElement('div')
 d.className='cell'
 grid.appendChild(d)
}
update()

/* ===== SPIN ===== */
async function spin(){
 if(money<bet)return
 money-=bet;update();clear()

 let board=[...Array(rows)].map(()=>[])
 let scat=0

 for(let c=0;c<cols;c++){
  for(let r=0;r<rows;r++){
   await sleep(80)
   const s=rand()
   set(r,c,s)
   board[r][c]=s
   if(s.k==='scatter')scat++
  }
 }

 if(scat>=3){
  alert('SCATTER BONUS +100K')
  money+=100000;save();update()
  return
 }

 check(board)
}

/* ===== WIN ===== */
function check(b){
 let win=0
 for(let r=0;r<rows;r++){
  let f=b[r][0]
  let count=1
  for(let c=1;c<cols;c++){
   if(b[r][c].k===f.k||b[r][c].k==='wild')count++
  }
  if(count>=3){
   win+=bet*f.w
   for(let c=0;c<count;c++)
    grid.children[r*cols+c].classList.add('win')
  }
 }
 if(win>0){
  money+=win
  msg.innerText='🎉 THẮNG '+win
 }else msg.innerText='❌ CHƯA TRÚNG'
 save();update()
}

/* ===== UI ===== */
function set(r,c,s){
 grid.children[r*cols+c].innerHTML=
 `<img src="${IMAGES[s.k]}">`
}
function rand(){return symbols[Math.floor(Math.random()*symbols.length)]}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function update(){
 moneyEl.innerText=money
 betEl.innerText=bet
}
function save(){
 localStorage.money=money
 localStorage.bet=bet
}
function clear(){
 document.querySelectorAll('.cell')
 .forEach(c=>c.classList.remove('win'))
}
function betUp(){if(bet<500000)bet+=2000;save();update()}
function betDown(){if(bet>2000)bet-=2000;save();update()}

const moneyEl=document.getElementById('money')
const betEl=document.getElementById('bet')
const msg=document.getElementById('msg')
const admin=document.getElementById('admin')

/* ===== ADMIN ===== */
document.addEventListener('keydown',e=>{
 if(e.key==='a')admin.style.display='block'
})
function login(){
 if(pin.value==='9999')alert('ADMIN OK')
 else alert('SAI PIN')
}
</script>
</body>
</html>
