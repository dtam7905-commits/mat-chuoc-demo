
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOLDEN PLAY</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main>
    <section class="auth">
        <h2>ĐĂNG NHẬP TÀI KHOẢN</h2>

        <input type="text" id="loginUser"
               placeholder="Tên đăng nhập">

        <input type="password" id="loginPass"
               placeholder="Mật khẩu">

        <button onclick="login()">Đăng nhập</button>

        <hr>

        <h2>ĐĂNG KÝ TÀI KHOẢN</h2>

        <input type="text" id="registerUser"
               placeholder="Tên đăng nhập mới">

        <input type="password" id="registerPass"
               placeholder="Mật khẩu mới">

        <button onclick="register()">Đăng ký</button>

        <p id="message"></p>
        <p id="welcome"></p>

        <button onclick="logout()">Đăng xuất</button>
    </section>
</main>

    <header>
        <h1>👑 GOLDEN PLAY</h1>
        <nav>
            <a href="#">Trang chủ</a>
            <a href="#">Trò chơi</a>
            <a href="#">Bảng xếp hạng</a>
        </nav>
    </header>

    <section class="banner">
        <h2>CHÀO MỪNG ĐẾN GOLDEN PLAY</h2>
        <p>Sảnh trò chơi giải trí với điểm ảo</p>
        <button onclick="showMessage()">Bắt đầu chơi</button>
    </section>

    <footer>
        © 2026 GOLDEN PLAY
    </footer>

    <script src="script.js"></script>
</body>
</html>
