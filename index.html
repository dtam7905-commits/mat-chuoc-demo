<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Mạt Chược VN</title>
<style>
body{
  margin:0;
  font-family:Arial;
  background:#145c3a;
  color:#fff;
  text-align:center;
}
.board{
  width:320px;
  margin:20px auto;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
  padding:10px;
  background:#000;
  border-radius:12px;
}
.cell{
  width:56px;
  height:56px;
  background:#fff;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.cell img{
  width:48px;
  height:48px;
}
.win{
  box-shadow:0 0 12px 4px gold;
}
button{
  padding:12px 40px;
  border:none;
  border-radius:10px;
  background:gold;
  font-size:18px;
}
#admin{
  display:none;
  position:fixed;
  inset:0;
  background:#000c;
  color:#fff;
}
</style>
</head>
<body>

<h2>🀄 MẠT CHƯỢC VN</h2>
<div>💰 Tiền: <span id="money">500000</span> | 🎯 Cược: <span id="bet">10000</span></div>

<div class="board" id="board"></div>

<button onclick="spin()">QUAY</button>
<div id="result"></div>

<div id="admin">
  <h3>ADMIN</h3>
  <input id="pin" placeholder="PIN"><br><br>
  <button onclick="login()">OK</button><br><br>
  <button onclick="money+=100000;update()">+100K</button>
  <button onclick="money-=100000;update()">-100K</button>
  <br><br>
  <button onclick="admin.style.display='none'">ĐÓNG</button>
</div>

<audio id="spinSound" src="https://assets.mixkit.co/sfx/preview/mixkit-slot-machine-spin-1930.mp3"></audio>

<script>
const symbols=[
 {n:'man',img:'images/man.png'},
 {n:'pin',img:'images/pin.png'},
 {n:'sou',img:'images/sou.png'},
 {n:'trung',img:'images/trung.png',wild:true},
 {n:'phat',img:'images/phat.png',scatter:true},
 {n:'bach',img:'images/bach.png'}
];

let grid=[];
let money=500000;
let bet=10000;
let keys=[];

const board=document.getElementById('board');
const moneyEl=document.getElementById('money');
const result=document.getElementById('result');

function update(){
  moneyEl.innerText=money;
}

function draw(){
  board.innerHTML='';
  grid.forEach(c=>{
    const d=document.createElement('div');
    d.className='cell';
    const i=document.createElement('img');
    i.src=c.img;
    d.appendChild(i);
    board.appendChild(d);
  });
}

function spin(){
  if(money<bet) return alert('Hết tiền');
  money-=bet;
  update();
  result.innerText='';
  document.getElementById('spinSound').play();
  grid=[];
  let col=0;
  function drop(){
    for(let r=0;r<5;r++){
      const s=symbols[Math.floor(Math.random()*symbols.length)];
      grid[col+r*5]=s;
    }
    draw();
    col++;
    if(col<5) setTimeout(drop,200);
    else setTimeout(checkWin,300);
  }
  drop();
}

function checkWin(){
  let win=0;
  let scatter=0;
  document.querySelectorAll('.cell').forEach(c=>c.classList.remove('win'));
  for(let r=0;r<5;r++){
    const row=[];
    for(let c=0;c<5;c++) row.push(grid[c+r*5]);
    if(row.every(x=>x.n===row[0].n||x.wild)){
      win+=bet*(r+1);
      for(let c=0;c<5;c++)
        board.children[c+r*5].classList.add('win');
    }
    row.forEach(x=>x.scatter&&scatter++);
  }
  if(scatter>=3){
    result.innerText='⭐ SCATTER – SANG GAME PHỤ ⭐';
  }
  if(win>0){
    money+=win;
    result.innerText='🎉 THẮNG '+win;
  }
  update();
}

document.addEventListener('keydown',e=>{
  keys.push(e.key);
  if(keys.slice(-3).join('')==='aaa')
    admin.style.display='block';
});

function login(){
  if(pin.value==='9999') alert('ADMIN OK');
  else alert('SAI PIN');
}
draw();
</script>
</body>
</html>
