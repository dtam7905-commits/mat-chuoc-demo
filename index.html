<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mạt Chược VN</title>

<style>
body {
  margin: 0;
  background: #0f5a3c;
  font-family: Arial, sans-serif;
  color: #fff;
}

.game {
  max-width: 420px;
  margin: auto;
  padding: 15px;
  text-align: center;
}

.header {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 10px;
}

.multipliers {
  display: flex;
  justify-content: space-between;
  background: #6b3f0e;
  padding: 8px;
  border-radius: 12px;
  margin-bottom: 10px;
}

.board {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  background: #000;
  padding: 10px;
  border-radius: 14px;
  margin-bottom: 10px;
}

.tile {
  background: #fff;
  border-radius: 8px;
  height: 60px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.tile img {
  width: 45px;
  height: 45px;
}

.result {
  margin: 10px 0;
  font-weight: bold;
  color: gold;
}

.info {
  display: flex;
  justify-content: space-between;
  margin-bottom: 12px;
}

.spin {
  width: 100%;
  padding: 16px;
  font-size: 20px;
  background: linear-gradient(#ffd45c, #e3a600);
  border: none;
  border-radius: 16px;
  font-weight: bold;
}
</style>
</head>

<body>
<div class="game">
  <div class="header">🀄 Mạt Chược VN</div>

  <div class="multipliers">
    <span>x1</span><span>x2</span><span>x3</span><span>x4</span><span>x5</span>
  </div>

  <div id="board" class="board"></div>

  <div id="result" class="result">Chưa quay</div>

  <div class="info">
    <div>Tiền: <span id="money">500000</span></div>
    <div>Cược: <span id="bet">10000</span></div>
  </div>

  <button class="spin" onclick="spin()">QUAY</button>
</div>

<script>
const board = document.getElementById("board");
const moneyEl = document.getElementById("money");
const resultEl = document.getElementById("result");

let money = 500000;
const bet = 10000;
const rows = 5;
const cols = 5;
let spinning = false;

const symbols = [
  "man","pin","sou",
  "trung","phat","bach"
];

function createBoard() {
  board.innerHTML = "";
  for (let i = 0; i < rows * cols; i++) {
    const tile = document.createElement("div");
    tile.className = "tile";
    tile.innerHTML = '<img src="images/bach.png">';
    board.appendChild(tile);
  }
}

function randomSymbol() {
  return symbols[Math.floor(Math.random() * symbols.length)];
}

function spin() {
  if (spinning) return;
  if (money < bet) {
    alert("Không đủ tiền!");
    return;
  }

  spinning = true;
  money -= bet;
  moneyEl.textContent = money;
  resultEl.textContent = "Đang quay...";

  const tiles = document.querySelectorAll(".tile");
  let col = 0;

  const interval = setInterval(() => {
    for (let r = 0; r < rows; r++) {
      const index = r * cols + col;
      const sym = randomSymbol();
      tiles[index].innerHTML = '<img src="images/' + sym + '.png">';
    }
    col++;

    if (col >= cols) {
      clearInterval(interval);
      spinning = false;
      checkWin();
    }
  }, 250);
}

function checkWin() {
  const win = Math.random() < 0.35;
  if (win) {
    const winAmount = bet * 10;
    money += winAmount;
    moneyEl.textContent = money;
    resultEl.textContent = "🎉 ĐẠI THẮNG MẠT CHƯỢC +" + winAmount.toLocaleString();
  } else {
    resultEl.textContent = "❌ CHƯA TRÚNG ❌";
  }
}

createBoard();
</script>
</body>
</html>
