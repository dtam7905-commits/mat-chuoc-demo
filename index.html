
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOLDEN PLAY</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>👑 GOLDEN PLAY</h1>
        <nav>
            <a href="#">Trang chủ</a>
            <a href="#">Trò chơi</a>
            <a href="#">Bảng xếp hạng</a>
        </nav>
    </header>

    <section class="banner">
        <h2>CHÀO MỪNG ĐẾN GOLDEN PLAY</h2>
        <p>Sảnh trò chơi giải trí với điểm ảo</p>
        <button onclick="showMessage()">Bắt đầu chơi</button>
    </section>

    <main>
        <h2>🎮 DANH SÁCH TRÒ CHƠI</h2>

        <div class="games">
            <div class="game">
                <h3>🎰 Slot Game</h3>
                <button onclick="playGame('Slot Game')">Chơi ngay</button>
            </div>

            <div class="game">
                <h3>🃏 Bài giải trí</h3>
                <button onclick="playGame('Bài giải trí')">Chơi ngay</button>
            </div>

            <div class="game">
                <h3>🎲 Xúc xắc</h3>
                <button onclick="playGame('Xúc xắc')">Chơi ngay</button>
            </div>
        </div>
    </main>

    <footer>
        © 2026 GOLDEN PLAY
    </footer>

    <script src="script.js"></script>
</body>
</html>
