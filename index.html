<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sảnh Game Demo</title>

<style>
body{
font-family:Arial;
background:#0c2a44;
color:white;
text-align:center;
}

.box{
background:#123b60;
padding:20px;
margin:20px auto;
width:300px;
border-radius:10px;
}

input{
width:90%;
padding:10px;
margin:5px;
}

button{
padding:10px 20px;
margin:5px;
border:none;
border-radius:5px;
}

.game{
background:#1d5f99;
padding:10px;
margin-top:10px;
}
</style>

</head>

<body>

<h1>🎰 Sảnh Game Demo</h1>

<div class="box" id="auth">

<h3>Đăng ký</h3>
<input id="regUser" placeholder="Tên đăng nhập">
<input id="regPass" placeholder="Mật khẩu" type="password">
<button onclick="register()">Đăng ký</button>

<h3>Đăng nhập</h3>
<input id="logUser" placeholder="Tên đăng nhập">
<input id="logPass" placeholder="Mật khẩu" type="password">
<button onclick="login()">Đăng nhập</button>

</div>


<div class="box" id="lobby" style="display:none">

<h2>Xin chào <span id="user"></span></h2>

<h3>💰 Số dư: <span id="money"></span></h3>

<input id="nap" placeholder="Số tiền nạp">
<button onclick="napTien()">Nạp tiền</button>

<br>

<input id="rut" placeholder="Số tiền rút">
<button onclick="rutTien()">Rút tiền</button>

<div class="game">
🎲 <a href="taixiu.html" style="color:white">Vào bàn Tài Xỉu</a>
</div>

<button onclick="logout()">Đăng xuất</button>

</div>


<script>

let users = JSON.parse(localStorage.getItem("users")) || {};
let currentUser = localStorage.getItem("currentUser");

if(currentUser){
showLobby();
}

function register(){

let u = document.getElementById("regUser").value;
let p = document.getElementById("regPass").value;

if(users[u]){
alert("Tài khoản đã tồn tại");
return;
}

users[u] = {pass:p,money:1000};

localStorage.setItem("users",JSON.stringify(users));

alert("Đăng ký thành công");
}

function login(){

let u = document.getElementById("logUser").value;
let p = document.getElementById("logPass").value;

if(!users[u] || users[u].pass!=p){
alert("Sai tài khoản");
return;
}

localStorage.setItem("currentUser",u);
showLobby();

}

function showLobby(){

currentUser = localStorage.getItem("currentUser");

document.getElementById("auth").style.display="none";
document.getElementById("lobby").style.display="block";

document.getElementById("user").innerText=currentUser;

updateMoney();

}

function updateMoney(){

document.getElementById("money").innerText=
users[currentUser].money;

localStorage.setItem("users",JSON.stringify(users));

}

function napTien(){

let n = parseInt(document.getElementById("nap").value);

users[currentUser].money += n;

updateMoney();

}

function rutTien(){

let r = parseInt(document.getElementById("rut").value);

users[currentUser].money -= r;

updateMoney();

}

function logout(){

localStorage.removeItem("currentUser");

location.reload();

}

</script>

</body>
</html>
