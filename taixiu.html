<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Dice Game</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#0f172a;
    color:white;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px;
}

.balance{
    font-size:28px;
    font-weight:bold;
    color:#22c55e;
    margin-bottom:20px;
}

.board{
    width:850px;
    max-width:95%;
    height:340px;
    border:8px solid #c07a52;
    border-radius:170px;
    position:relative;
    background:#1e293b;
}

.side{
    width:180px;
    height:100px;
    border:4px solid #fff;
    border-radius:20px;
    position:absolute;
    top:70px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.side:hover{
    transform:scale(1.05);
}

.left{
    left:55px;
}

.right{
    right:55px;
}

.selected{
    background:#f59e0b;
    color:black;
}

.center{
    width:170px;
    height:170px;
    border:4px solid white;
    border-radius:50%;
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:60px;
}

.topbox{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    border:3px solid white;
    width:140px;
    text-align:center;
    padding:6px;
    border-radius:8px;
}

.chips{
    margin-top:25px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
}

.chip{
    width:70px;
    height:70px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    font-size:18px;
    font-weight:bold;
}

.chip:nth-child(1){background:#ef4444;}
.chip:nth-child(2){background:#f59e0b;}
.chip:nth-child(3){background:#22c55e;}
.chip:nth-child(4){background:#3b82f6;}
.chip:nth-child(5){background:#a855f7;}

.actions{
    margin-top:20px;
}

button.action{
    padding:12px 24px;
    margin:5px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}

#shakeBtn{
    background:#f59e0b;
}

#openBtn{
    background:#3b82f6;
    color:white;
}

#info{
    margin-top:20px;
    font-size:22px;
    text-align:center;
}

.history{
    margin-top:20px;
    width:850px;
    max-width:95%;
    background:#111827;
    padding:15px;
    border-radius:10px;
}

.history h3{
    margin-bottom:10px;
}

.history-list{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.item{
    background:#374151;
    padding:8px 12px;
    border-radius:8px;
}
</style>
</head>
<body>

<div class="balance">
Điểm: <span id="balance">1000</span>
</div>

<div class="board">

<div class="topbox">
Phiên Demo
</div>

<div class="side left" id="leftBox">
LỚN
</div>

<div class="center" id="bowl">
🎲
</div>

<div class="side right" id="rightBox">
NHỎ
</div>

</div>

<div class="chips">
<button class="chip" onclick="setBet(10)">10</button>
<button class="chip" onclick="setBet(50)">50</button>
<button class="chip" onclick="setBet(100)">100</button>
<button class="chip" onclick="setBet(500)">500</button>
<button class="chip" onclick="setBet(1000)">1000</button>
</div>

<div style="margin-top:10px">
Cược hiện tại:
<b id="betValue">0</b>
</div>

<div class="actions">
<button id="shakeBtn" class="action" onclick="shakeGame()">
Xóc
</button>

<button id="openBtn" class="action" onclick="openGame()">
Mở
</button>
</div>

<div id="info">
Chọn cửa và mức điểm.
</div>

<div class="history">
<h3>Lịch sử</h3>
<div id="history" class="history-list"></div>
</div>

<script>

let balance = 1000;
let bet = 0;
let choice = null;
let dice = null;
let shaking = false;

const balanceEl = document.getElementById("balance");

document.getElementById("leftBox").onclick = () =>{
    choice = "large";
    document.getElementById("leftBox").classList.add("selected");
    document.getElementById("rightBox").classList.remove("selected");
};

document.getElementById("rightBox").onclick = () =>{
    choice = "small";
    document.getElementById("rightBox").classList.add("selected");
    document.getElementById("leftBox").classList.remove("selected");
};

function setBet(v){
    bet = v;
    document.getElementById("betValue").innerText = v;
}

function rnd(){
    return Math.floor(Math.random()*6)+1;
}

function shakeGame(){

    if(!choice){
        alert("Hãy chọn cửa trước.");
        return;
    }

    if(bet <= 0){
        alert("Hãy chọn mức điểm.");
        return;
    }

    if(balance < bet){
        alert("Không đủ điểm.");
        return;
    }

    shaking = true;

    dice = [rnd(), rnd(), rnd()];

    document.getElementById("info").innerHTML =
    "Đang xóc...";

    let bowl = document.getElementById("bowl");

    let icons = ["🎲","🎲","🎲","🎯","🎲"];

    let anim = setInterval(()=>{
        bowl.innerHTML =
        icons[Math.floor(Math.random()*icons.length)];
    },100);

    setTimeout(()=>{
        clearInterval(anim);
        bowl.innerHTML = "🥣";
        shaking = false;
        document.getElementById("info").innerHTML =
        "Xóc xong. Nhấn Mở.";
    },2500);
}

function openGame(){

    if(!dice){
        alert("Hãy xóc trước.");
        return;
    }

    if(shaking){
        return;
    }

    let total = dice[0]+dice[1]+dice[2];

    let result =
        total >= 11 ? "large" : "small";

    let win = result === choice;

    if(win){
        balance += bet;
    }else{
        balance -= bet;
    }

    balanceEl.innerText = balance;

    document.getElementById("bowl").innerHTML =
        dice.join(" ");

    document.getElementById("info").innerHTML =
        `
        Kết quả: ${dice.join(" - ")}
        <br>
        Tổng: <b>${total}</b>
        <br>
        ${win ? "🎉 Thắng" : "❌ Thua"}
        `;

    addHistory(total);

    dice = null;

    if(balance <= 0){
        alert("Hết điểm. Reset về 1000.");
        balance = 1000;
        balanceEl.innerText = balance;
    }
}

function addHistory(total){

    let div = document.createElement("div");
    div.className = "item";
    div.innerText =
        total + (total >= 11 ? " LỚN" : " NHỎ");

    let history =
        document.getElementById("history");

    history.prepend(div);

    while(history.children.length > 10){
        history.removeChild(history.lastChild);
    }
}
</script>

</body>
</html>
