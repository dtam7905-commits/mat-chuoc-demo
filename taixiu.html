<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tài Xỉu Demo</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
    margin-top:40px;
    background:#f5f5f5;
}
.container{
    background:white;
    width:400px;
    margin:auto;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}
input,select,button{
    padding:10px;
    margin:8px;
}
button{
    cursor:pointer;
    background:#4CAF50;
    color:white;
    border:none;
    border-radius:5px;
}
#result{
    margin-top:20px;
    font-size:18px;
}
.balance{
    color:#2196F3;
    font-weight:bold;
    font-size:22px;
}
</style>
</head>

<body>

<div class="container">
    <h2>Tài Xỉu Demo</h2>

    <p>Điểm hiện có:</p>
    <div class="balance" id="balance">1000</div>

    <div>
        <select id="choice">
            <option value="tai">Tài (11-17)</option>
            <option value="xiu">Xỉu (4-10)</option>
        </select>
    </div>

    <div>
        <input type="number" id="bet" min="1" value="100" placeholder="Số điểm cược">
    </div>

    <button onclick="play()">Lắc Xúc Xắc</button>

    <div id="result"></div>
</div>

<script>
let balance = 1000;

function dice() {
    return Math.floor(Math.random() * 6) + 1;
}

function play() {

    let bet = parseInt(document.getElementById("bet").value);
    let choice = document.getElementById("choice").value;

    if (isNaN(bet) || bet <= 0) {
        alert("Nhập số điểm cược hợp lệ!");
        return;
    }

    if (bet > balance) {
        alert("Không đủ điểm!");
        return;
    }

    let d1 = dice();
    let d2 = dice();
    let d3 = dice();

    let total = d1 + d2 + d3;

    let result = "";

    if (total >= 11 && total <= 17) {
        result = "tai";
    } else if (total >= 4 && total <= 10) {
        result = "xiu";
    } else {
        result = "bo3"; // 3 hoặc 18
    }

    let message = "";

    if (result === choice) {
        balance += bet;
        message = "🎉 Thắng +" + bet + " điểm";
    } else {
        balance -= bet;
        message = "❌ Thua -" + bet + " điểm";
    }

    document.getElementById("balance").innerText = balance;

    document.getElementById("result").innerHTML = `
        <p>Xúc xắc: ${d1} - ${d2} - ${d3}</p>
        <p>Tổng: <b>${total}</b></p>
        <p>Kết quả: <b>${result.toUpperCase()}</b></p>
        <p>${message}</p>
    `;

    if (balance <= 0) {
        alert("Bạn đã hết điểm!");
        balance = 1000;
        document.getElementById("balance").innerText = balance;
    }
}
</script>

</body>
</html>
